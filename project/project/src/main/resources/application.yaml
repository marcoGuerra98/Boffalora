spring:
  datasource:
    # Server MySQL locale (connessione IDE "BELLUM"), schema applicativo: boffalora
    url: jdbc:mysql://localhost:3306/boffalora
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  application:
    name: project

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: boffalora
        format_sql: true
        use_sql_comments: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change-me-dev-secret-key-please-replace-1234567890}
  expiration-ms: 3600000
  issuer: boffalora-app
